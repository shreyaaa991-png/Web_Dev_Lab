<!DOCTYPE html>
<html>
<head>
<title>Portfolio Projects Grid</title>

<style>
body {
    font-family: Arial;
    background: #eee;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

/* Project Grid */
.projects {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

/* Project Cards */
.card {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 2px 5px gray;
}

.card h2 {
    color: blue;
}

/* Responsive Grid */
@media (max-width: 700px) {
    .projects {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 450px) {
    .projects {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<h1>My Projects</h1>

<div class="projects">

    <div class="card">
        <h2>Project 1</h2>
        <p>Portfolio Website</p>
    </div>

    <div class="card">
        <h2>Project 2</h2>
        <p>Shopping Website</p>
    </div>

    <div class="card">
        <h2>Project 3</h2>
        <p>Login Page</p>
    </div>

    <div class="card">
        <h2>Project 4</h2>
        <p>News Website</p>
    </div>

    <div class="card">
        <h2>Project 5</h2>
        <p>Blog Website</p>
    </div>

    <div class="card">
        <h2>Project 6</h2>
        <p>Contact Page</p>
    </div>

</div>

</body>
</html>
