<!DOCTYPE html>
<html>
<head>
    <title>Sticky Navbar and Card Overlay</title>

    <style>
        /* GENERAL STYLE */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        /* STICKY NAVBAR */
        nav {
            position: sticky;
            top: 0;
            background: #2563eb;
            padding: 15px;
            text-align: center;
            z-index: 100;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        /* CARD */
        .card {
            position: relative;
            width: 300px;
            margin: 50px auto;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* CARD OVERLAY */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 0 0 10px 10px;
        }

        /* EXTRA CONTENT */
        .content {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <!-- CARD WITH OVERLAY -->
    <div class="card">

        <img src="https://picsum.photos/400/300"
             alt="Nature">

        <div class="overlay">
            <h2>Beautiful Nature</h2>
            <p>Explore the beauty of nature!</p>
        </div>

    </div>

    <!-- PAGE CONTENT -->
    <div class="content">
        <h2>Welcome to My Website</h2>
        <p>Scroll down to see the sticky navbar.</p>
        <p>Sticky navigation stays at the top.</p>
        <p>CSS positioning makes web design easy.</p>
        <p>Thank you for visiting!</p>
    </div>

</body>
</html>
