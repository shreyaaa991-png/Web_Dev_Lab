<!DOCTYPE html>
<html>
<head>
<title>Portfolio Header and Footer</title>

<style>
body {
    margin: 0;
    font-family: Arial;
}

/* Header */
header {
    background: #222;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header a {
    color: white;
    text-decoration: none;
    margin: 10px;
}

/* Main */
main {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 300px;
    background: lightblue;
    text-align: center;
}

/* Footer */
footer {
    background: #222;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

@media (max-width: 600px) {
    header, footer {
        flex-direction: column;
        gap: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h2>My Portfolio</h2>

    <div>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
</header>

<main>
    <div>
        <h1>Welcome to My Portfolio</h1>
        <p>I am a Web Developer.</p>
    </div>
</main>

<footer>
    <p>© 2026 My Portfolio</p>
    <p>Contact: example@gmail.com</p>
</footer>

</body>
</html>
