<!DOCTYPE html>
<html>

<head>
    <title>Design Tokens</title>

    <style>
        :root {
            --blue: rgb(255, 0, 170);
            --size: 20px;
        }

        body {
            font-family: Arial;
            background: rgb(24, 23, 23);
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            color: var(--blue);
        }

        p {
            font-size: 14px;
        }

        button {
            background: var(--blue);
            color: rgb(212, 170, 170);
            padding: 10px;
            border: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Design Tokens</h1>

        <h2>Typography System</h2>

        <p>
            Design tokens help reuse colors,
            fonts and sizes in CSS.
        </p>

        <button>Learn More</button>
    </div>

</body>

</html>
